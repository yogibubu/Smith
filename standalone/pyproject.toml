[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smith-sonic"
version = "0.1.0rc4"
description = "Standalone SMITH builder for SONIC internal-coordinate contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "matrix-core @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-core",
  "matrix-chem @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-chem",
  "matrix-engines @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-engines",
  "matrix-fragments @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-fragments",
  "matrix-gaussian @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-gaussian",
  "matrix-neo @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-neo",
  "matrix-qm @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-qm",
  "matrix-rovib @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-rovib",
]

[project.optional-dependencies]
test = [
  "matrix-morpheus @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-morpheus",
  "matrix-trinity @ git+https://github.com/yogibubu/MATRIX.git@cf5fdcebb85a5035d5c0400d7cc2398a0580df66#subdirectory=packages/matrix-trinity",
]

[project.scripts]
smith-sonic = "smith_sonic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smith_sonic = ["examples/*.xyz", "examples/*.xyzin"]
